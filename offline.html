<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>BriefIQ — Offline</title>
<style>
body{margin:0;background:#f0eee9;color:#111;font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.card{background:#fff;border:1.5px solid #111;border-radius:22px;padding:40px;max-width:520px}
h1{font-family:Impact,'Anton',sans-serif;font-size:40px;line-height:1;text-transform:uppercase;margin:0 0 14px}
.k{font-family:monospace;font-size:10px;letter-spacing:2px;color:#FF4D00;margin-bottom:14px}
p{font-size:15px;line-height:1.6;color:#55534e}
.ok{color:#00733a;font-weight:700}.no{color:#c23a00;font-weight:700}
a{display:inline-block;margin-top:18px;background:#FF4D00;color:#fff;text-decoration:none;border-radius:100px;padding:14px 28px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="k">✳ YOU'RE OFFLINE</div>
  <h1>The engine still works.</h1>
  <p><span class="ok">Works offline:</span> BriefIQ Engine analysis, production intelligence, brief scoring, projects, exports, all your saved work.</p>
  <p><span class="no">Needs internet:</span> ChatGPT / Claude / Gemini models, live reference links, research sources.</p>
  <a href="index.html#analyse">Open BriefIQ ↗</a>
</div>
</body>
